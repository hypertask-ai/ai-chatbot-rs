# Copied into every repo agents push to by scripts/secret-scan in hypertask-ai/hypertask (YPER4-324).
# gitleaks finds key-shaped strings; trufflehog finds known key types. Any hit fails the check,
# because trufflehog's live check can call a working key dead. A false hit: `trufflehog:ignore` on its line.
name: Gitleaks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    # Deleting a branch adds no commits, so there is nothing to scan.
    if: github.event_name != 'push' || !github.event.deleted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Pick the commits to scan
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            # A pull request scans only the commits it adds.
            base="$PR_BASE_SHA"; head="$PR_HEAD_SHA"
          else
            # A push scans only the commits it adds to the default branch. A branch is
            # scanned from where it left that branch, so merging the default branch back
            # into it does not rescan commits that already landed there.
            head="$PUSH_HEAD_SHA"
            base=""
            if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
              base=$(git merge-base "$head" "origin/$DEFAULT_BRANCH" || true)
            fi
            if [ -z "$base" ] && [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
              base="$PUSH_BEFORE_SHA"
            fi
          fi
          echo "Scanning ${base:-the whole history}..$head"
          echo "SCAN_BASE=$base" >> "$GITHUB_ENV"
          echo "SCAN_HEAD=$head" >> "$GITHUB_ENV"
      - name: Run gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --no-banner --source . --redact --log-opts "${SCAN_BASE:+$SCAN_BASE..}$SCAN_HEAD"
      - name: Run trufflehog
        run: |
          curl -sSfL https://github.com/trufflesecurity/trufflehog/releases/download/v3.97.0/trufflehog_3.97.0_linux_amd64.tar.gz | tar -xz trufflehog
          # --json keeps values out of the plain log; only the key type and place are printed.
          set +e
          # help site repo (HTPR-9150): these files hold 40-character commit SHAs, GitHub URLs
          # and lockfile integrity hashes that trufflehog reads as keys, and the allowlist names
          # its fingerprints by commit SHA. gitleaks still scans all of them.
          ./trufflehog git "file://$PWD" --branch "$SCAN_HEAD" ${SCAN_BASE:+--since-commit "$SCAN_BASE"} \
            --exclude-globs "pnpm-lock.yaml,PROVENANCE.md,skills/security-audit/UPSTREAM.md,.github/trufflehog-allowlist.json,.brain/data/**,.brain/resources/**" \
            --fail --no-update --json > found.json 2> trufflehog.err
          code=$?
          set -e
          if [ "$code" != 0 ] && [ "$code" != 183 ]; then tail -5 trufflehog.err; exit "$code"; fi
          # A finding is dropped only when .github/trufflehog-allowlist.json names its detector,
          # its commit and its file, and gives a reason. Everything else fails this check.
          jq -c 'select(.DetectorName != null)' found.json > findings.json || true
          jq -c --slurpfile allow .github/trufflehog-allowlist.json '
            . as $finding
            | select(
                ($allow[0].entries | map(select(
                  .detector == $finding.DetectorName
                  and .commit == $finding.SourceMetadata.Data.Git.commit
                  and .file == $finding.SourceMetadata.Data.Git.file
                )) | length) == 0
              )
          ' findings.json > remaining.json
          findings="$(wc -l < findings.json)"
          remaining="$(wc -l < remaining.json)"
          jq -r --slurpfile allow .github/trufflehog-allowlist.json '
            . as $finding
            | $allow[0].entries[]
            | select(
                .detector == $finding.DetectorName
                and .commit == $finding.SourceMetadata.Data.Git.commit
                and .file == $finding.SourceMetadata.Data.Git.file
              )
            | "allowlisted: \(.detector) in \(.file) at \(.commit) because \(.reason)"
          ' findings.json | sort -u
          grep -o '"chunks":[0-9]*\|"bytes":[0-9]*\|"verified_secrets":[0-9]*\|"unverified_secrets":[0-9]*' trufflehog.err | tr '\n' ' ' || true
          printf '\ntrufflehog reported %s findings; %s are named in the allowlist and %s are not.\n' "$findings" "$((findings - remaining))" "$remaining"
          if [ "$remaining" -ne 0 ]; then
            jq -r '"\(.DetectorName) in \(.SourceMetadata.Data.Git.file) line \(.SourceMetadata.Data.Git.line) at \(.SourceMetadata.Data.Git.commit)"' remaining.json
            echo "::error::trufflehog found $remaining values that no allowlist entry names. Remove the value, and roll it if it was ever real."
            exit 1
          fi
          rm -f found.json findings.json remaining.json
