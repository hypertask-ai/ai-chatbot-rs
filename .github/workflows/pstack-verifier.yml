name: Verifier

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to verify
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pstack-verifier-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  pstack-verifier:
    name: pstack-verifier
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REPO: ${{ github.repository }}
      SERVER_URL: ${{ github.server_url }}
      RUN_ID: ${{ github.run_id }}
      LIVE_URL: https://help.hypertask.ai
      PREVIEW_URL: https://help.hypertask.ai/ratstack
    steps:
      - name: Check out the verifier gate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Use Node.js 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0

      - name: Resolve the pull request, its head and its base
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          set -euo pipefail
          case "${PR_NUMBER:-}" in
            ''|*[!0-9]*) echo "::error::No pull request number was given."; exit 1 ;;
          esac
          gh pr view "$PR_NUMBER" --repo "$REPO" --json state,isDraft,headRefOid,baseRefOid,headRepository,url > "$RUNNER_TEMP/pr.json"
          state="$(jq -r .state "$RUNNER_TEMP/pr.json")"
          draft="$(jq -r .isDraft "$RUNNER_TEMP/pr.json")"
          sha="$(jq -r .headRefOid "$RUNNER_TEMP/pr.json" | tr '[:upper:]' '[:lower:]')"
          base="$(jq -r .baseRefOid "$RUNNER_TEMP/pr.json" | tr '[:upper:]' '[:lower:]')"
          head_repo="$(jq -r .headRepository.nameWithOwner "$RUNNER_TEMP/pr.json")"
          case "$sha" in
            *[!0-9a-f]*|'') echo "::error::The head commit is not a full commit SHA: $sha"; exit 1 ;;
          esac
          if [ "${#sha}" -ne 40 ]; then
            echo "::error::The head commit is not a full commit SHA: $sha"
            exit 1
          fi
          case "$base" in
            *[!0-9a-f]*|'') echo "::error::The base commit is not a full commit SHA: $base"; exit 1 ;;
          esac
          if [ "${#base}" -ne 40 ]; then
            echo "::error::The base commit is not a full commit SHA: $base"
            exit 1
          fi
          go=yes
          if [ "$head_repo" != "$REPO" ]; then
            go=no
            echo "::notice::skipped: pull request $PR_NUMBER comes from the fork $head_repo, and a fork gets no verifier setting."
          elif [ "$state" != "OPEN" ]; then
            go=no
            echo "::notice::skipped: pull request $PR_NUMBER is $state."
          elif [ "$draft" = "true" ]; then
            go=no
            echo "::notice::skipped: pull request $PR_NUMBER is a draft. The verifier runs when it is ready for review."
          fi
          printf 'go=%s\nnumber=%s\nsha=%s\nbase=%s\n' "$go" "$PR_NUMBER" "$sha" "$base" >> "$GITHUB_OUTPUT"

      - name: Check out the pull request head
        if: steps.target.outputs.go == 'yes'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 24.18.0
        if: steps.target.outputs.go == 'yes'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0

      - name: Check the diff reader on a fixture
        if: steps.target.outputs.go == 'yes'
        run: node --test verify/diff.test.mjs

      - name: Enable corepack pnpm
        if: steps.target.outputs.go == 'yes'
        run: corepack enable && corepack prepare pnpm@11.3.0 --activate

      - name: Install dependencies for the head
        if: steps.target.outputs.go == 'yes'
        run: |
          pnpm install --frozen-lockfile
          pnpm sources:fetch

      - name: Add the pull request base to a second tree
        id: base
        if: steps.target.outputs.go == 'yes'
        env:
          BASE_SHA: ${{ steps.target.outputs.base }}
        run: |
          set -euo pipefail
          if git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA" > "$RUNNER_TEMP/worktree.log" 2>&1; then
            echo "ok=yes" >> "$GITHUB_OUTPUT"
            printf 'base: %s in %s\n' "$BASE_SHA" "$RUNNER_TEMP/base" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ok=no" >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/worktree.log"
            echo "::notice::The base commit $BASE_SHA is not in this checkout, so this run compares the head with the live old site only."
          fi

      - name: Install dependencies for the base
        if: steps.target.outputs.go == 'yes' && steps.base.outputs.ok == 'yes'
        id: baseinstall
        continue-on-error: true
        working-directory: ${{ runner.temp }}/base
        run: |
          pnpm install --frozen-lockfile
          pnpm sources:fetch

      - name: Build the head the way ci.yml builds
        if: steps.target.outputs.go == 'yes'
        run: pnpm turbo run build --concurrency=2

      - name: Build the base the way ci.yml builds
        if: steps.target.outputs.go == 'yes' && steps.base.outputs.ok == 'yes' && steps.baseinstall.outcome == 'success'
        id: basebuild
        continue-on-error: true
        working-directory: ${{ runner.temp }}/base
        run: pnpm turbo run build --concurrency=2

      - name: Install Playwright Chromium for the verifier
        if: steps.target.outputs.go == 'yes'
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/browser" --no-fund --no-audit playwright@1.65.1
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/browser/screens"
          ln -sfn "$RUNNER_TEMP/browser/node_modules" "$GITHUB_WORKSPACE/verify/node_modules"
          printf 'SCREENS_DIR=%s\n' "$RUNNER_TEMP/browser/screens" >> "$GITHUB_ENV"

      - name: Seed recorded articles and a sample chat
        if: steps.target.outputs.go == 'yes'
        run: |
          set -euo pipefail
          node verify/seed.mjs --wrap "$GITHUB_WORKSPACE/apps/web/dist"
          if [ -f "$RUNNER_TEMP/base/apps/web/dist/server/foldkit.build.json" ]; then
            node verify/seed.mjs --wrap "$RUNNER_TEMP/base/apps/web/dist"
          fi
          node verify/seed.mjs --port 4178 > "$RUNNER_TEMP/seed.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/seed.pid"
          ready=no
          for attempt in $(seq 1 30); do
            if grep -q "seed: /api/articles returned 97 articles" "$RUNNER_TEMP/seed.log" && grep -q "seed: opened past chat seed-past-chat" "$RUNNER_TEMP/seed.log"; then
              ready=yes
              break
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/seed.pid")" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/seed.log"
          if [ "$ready" != "yes" ]; then
            echo "::error::The verify seed did not log 97 articles and an opened past chat."
            exit 1
          fi
          node verify/driver.mjs page --head "http://127.0.0.1:4178" --path "/widget/chat?conversation=seed-past-chat" > "$RUNNER_TEMP/seed-page.json"
          node verify/seed.mjs --expect-page "$RUNNER_TEMP/seed-page.json"
          printf 'VERIFY_SEED_URL=http://127.0.0.1:4178\n' >> "$GITHUB_ENV"
          {
            printf 'seed: /api/articles returned 97 articles\n'
            printf 'seed: opened past chat seed-past-chat\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Serve the built sites and any local Worker on the runner
        if: steps.target.outputs.go == 'yes'
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/serve.mjs" <<'SERVER'
          import { createReadStream } from "node:fs";
          import { stat } from "node:fs/promises";
          import { createServer } from "node:http";
          import path from "node:path";

          const root = path.resolve(process.argv[2]);
          const port = Number(process.argv[3]);

          const types = {
            ".avif": "image/avif",
            ".css": "text/css; charset=utf-8",
            ".html": "text/html; charset=utf-8",
            ".ico": "image/x-icon",
            ".jpeg": "image/jpeg",
            ".jpg": "image/jpeg",
            ".js": "text/javascript; charset=utf-8",
            ".json": "application/json; charset=utf-8",
            ".map": "application/json; charset=utf-8",
            ".md": "text/markdown; charset=utf-8",
            ".mjs": "text/javascript; charset=utf-8",
            ".png": "image/png",
            ".svg": "image/svg+xml",
            ".txt": "text/plain; charset=utf-8",
            ".wasm": "application/wasm",
            ".webmanifest": "application/manifest+json",
            ".webp": "image/webp",
            ".woff": "font/woff",
            ".woff2": "font/woff2",
            ".xml": "application/xml; charset=utf-8"
          };

          const candidatesFor = (urlPath) => {
            const base = path.resolve(
              root,
              decodeURIComponent(urlPath).replace(/^\/+/u, "").replace(/\/+$/u, "")
            );

            if (base !== root && !base.startsWith(`${root}${path.sep}`)) {
              return [];
            }

            return [base, path.join(base, "index.html"), `${base}.html`];
          };

          const fileAt = async (paths) => {
            for (const candidate of paths) {
              try {
                const info = await stat(candidate);

                if (info.isFile()) {
                  return candidate;
                }
              } catch {}
            }

            return undefined;
          };

          createServer(async (request, response) => {
            const url = new URL(request.url ?? "/", "http://127.0.0.1");
            const found = await fileAt(candidatesFor(url.pathname));

            if (found === undefined) {
              const fallback = await fileAt([path.join(root, "404.html")]);
              response.writeHead(404, {
                "content-type":
                  fallback === undefined ? types[".txt"] : types[".html"]
              });

              if (request.method === "HEAD" || fallback === undefined) {
                response.end(fallback === undefined ? `404 ${url.pathname}\n` : undefined);
                return;
              }

              createReadStream(fallback).pipe(response);
              return;
            }

            response.writeHead(200, {
              "content-type": types[path.extname(found)] ?? "application/octet-stream"
            });

            if (request.method === "HEAD") {
              response.end();
              return;
            }

            createReadStream(found).pipe(response);
          }).listen(port, "127.0.0.1", () => {
            console.log(`serving ${root} on http://127.0.0.1:${port}`);
          });
          SERVER

          site_root() {
            for candidate in "$1/apps/web/dist/client" "$1"/apps/*/dist/client; do
              if [ -f "$candidate/index.html" ]; then
                printf '%s\n' "$candidate"
                return 0
              fi
            done
            return 1
          }

          wait_for() {
            local url="$1" pid="$2" attempts="$3" attempt code
            for attempt in $(seq 1 "$attempts"); do
              if ! kill -0 "$pid" 2>/dev/null; then
                return 1
              fi
              code="$(curl --silent --output /dev/null --max-time 2 --write-out '%{http_code}' "$url" || true)"
              if [ -n "$code" ] && [ "$code" != "000" ]; then
                echo "the site answered $code at $url on attempt $attempt"
                return 0
              fi
              sleep 2
            done
            return 1
          }

          local_worker() {
            local tree="$1" app command
            for app in "$tree"/apps/*; do
              [ -f "$app/package.json" ] || continue
              for command in preview dev; do
                case "$(jq -r --arg name "$command" '.scripts[$name] // ""' "$app/package.json")" in
                  *"wrangler dev"*) printf '%s\n' "$app"; return 0 ;;
                esac
              done
            done
            return 1
          }

          start_worker() {
            local tree="$1" port="$2" side="$3" app wrangler
            app="$(local_worker "$tree")" || return 1
            wrangler="$app/node_modules/.bin/wrangler"
            if [ ! -x "$wrangler" ]; then
              echo "::notice::$side declares a local Worker dev or preview script, but $wrangler is missing. Only the built files are served for that side."
              return 2
            fi
            (
              cd "$app"
              exec "$wrangler" dev --ip 127.0.0.1 --port "$port" --local
            ) > "$RUNNER_TEMP/$side-worker.log" 2>&1 &
            printf '%s\n' "$!" > "$RUNNER_TEMP/$side-worker.pid"
            if ! wait_for "http://127.0.0.1:$port/" "$(cat "$RUNNER_TEMP/$side-worker.pid")" 60; then
              echo "::notice::$side declares a local Worker dev or preview script in $app, but it did not answer on http://127.0.0.1:$port within 120 seconds. Only the built files are served for that side."
              return 2
            fi
            return 0
          }

          head_root="$(site_root "$GITHUB_WORKSPACE" || true)"
          if [ -z "$head_root" ]; then
            echo "::error::The head build left no apps/*/dist/client/index.html, so there is nothing to serve."
            find apps -maxdepth 3 -type d -name dist -print
            exit 1
          fi
          node "$RUNNER_TEMP/serve.mjs" "$head_root" 4173 > "$RUNNER_TEMP/head.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/head.pid"
          if ! wait_for "http://127.0.0.1:4173/" "$(cat "$RUNNER_TEMP/head.pid")" 60; then
            cat "$RUNNER_TEMP/head.log"
            echo "::error::The head site did not answer on http://127.0.0.1:4173 within 120 seconds."
            exit 1
          fi

          base_root=""
          if [ "${{ steps.basebuild.outcome }}" = "success" ]; then
            base_root="$(site_root "$RUNNER_TEMP/base" || true)"
          fi
          if [ -z "$base_root" ]; then
            echo "::notice::The base has no built site, so this run compares the head with the live old site only."
          else
            node "$RUNNER_TEMP/serve.mjs" "$base_root" 4174 > "$RUNNER_TEMP/base.log" 2>&1 &
            echo "$!" > "$RUNNER_TEMP/base.pid"
            if ! wait_for "http://127.0.0.1:4174/" "$(cat "$RUNNER_TEMP/base.pid")" 60; then
              cat "$RUNNER_TEMP/base.log"
              echo "::notice::The base site did not answer on http://127.0.0.1:4174, so this run compares the head with the live old site only."
              base_root=""
            fi
          fi

          head_worker=""
          base_worker=""
          head_status=0
          base_status=0
          start_worker "$GITHUB_WORKSPACE" 4175 head || head_status=$?
          if [ "$head_status" -eq 0 ]; then
            head_worker="http://127.0.0.1:4175"
          fi
          if [ -n "$base_root" ]; then
            start_worker "$RUNNER_TEMP/base" 4176 base || base_status=$?
            if [ "$base_status" -eq 0 ]; then
              base_worker="http://127.0.0.1:4176"
            fi
          else
            base_status=3
          fi

          head_mode="built files"
          base_mode="not served"
          if [ -n "$head_worker" ]; then
            head_mode="built files and the app's own local Worker"
          elif [ "$head_status" -eq 1 ]; then
            echo "::notice::The head declares no local Worker dev or preview script that runs without a Cloudflare login, so only the built files are served there. A redirect, /health, a CORS answer or an unknown address is unproven in this run."
          fi
          if [ -n "$base_worker" ]; then
            base_mode="built files and the app's own local Worker"
          elif [ -n "$base_root" ]; then
            base_mode="built files"
            if [ "$base_status" -eq 1 ]; then
              echo "::notice::The base declares no local Worker dev or preview script that runs without a Cloudflare login, so only the built files are served there."
            fi
          fi

          {
            printf 'SITE_ROOT=%s\nSITE_URL=http://127.0.0.1:4173\n' "$head_root"
            printf 'BASE_ROOT=%s\n' "$base_root"
            if [ -n "$base_root" ]; then printf 'BASE_URL=http://127.0.0.1:4174\n'; fi
            printf 'SITE_WORKER_URL=%s\nBASE_WORKER_URL=%s\n' "$head_worker" "$base_worker"
            printf 'SERVE_MODE_HEAD=%s\nSERVE_MODE_BASE=%s\n' "$head_mode" "$base_mode"
          } >> "$GITHUB_ENV"
          {
            printf 'head: %s on http://127.0.0.1:4173, %s\n' "$head_root" "$head_mode"
            if [ -n "$head_worker" ]; then printf 'head local Worker: %s\n' "$head_worker"; fi
            if [ -n "$base_root" ]; then
              printf 'base: %s on http://127.0.0.1:4174, %s\n' "$base_root" "$base_mode"
              if [ -n "$base_worker" ]; then printf 'base local Worker: %s\n' "$base_worker"; fi
            else
              printf 'base: not served, the live old site is the reference\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Read the change under review from the checkout
        if: steps.target.outputs.go == 'yes'
        env:
          SHA: ${{ steps.target.outputs.sha }}
          BASE_SHA: ${{ steps.target.outputs.base }}
          DIFF_LIMIT_BYTES: "200000"
        run: |
          set -euo pipefail
          base_sha="$BASE_SHA"
          if ! git -C "$GITHUB_WORKSPACE" cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$base_sha" > /dev/null 2>&1 || true
          fi
          if ! git -C "$GITHUB_WORKSPACE" cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            base_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse "$SHA^")"
            echo "::notice::The base commit $BASE_SHA is not in the checkout, so the change is read against the head's own parent $base_sha."
          fi
          node "$GITHUB_WORKSPACE/verify/diff.mjs" \
            --repo "$GITHUB_WORKSPACE" \
            --base "$base_sha" \
            --head "$SHA" \
            --out "$RUNNER_TEMP" \
            --limit "$DIFF_LIMIT_BYTES" > "$RUNNER_TEMP/diff.json"
          printf 'DIFF_BASE=%s\n' "$base_sha" >> "$GITHUB_ENV"
          jq -r '"diff: \(.files) files, \(.bytes) bytes, prompt copy capped: \(.capped)"' "$RUNNER_TEMP/diff.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Write the verifier prompt with the change under review
        if: steps.target.outputs.go == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
          PR: ${{ steps.target.outputs.number }}
        run: |
          set -euo pipefail
          gh pr view "$PR" --repo "$REPO" --json title,body,url --jq '"Title: \(.title)\n\nBody:\n\(if .body == "" or .body == null then "(empty)" else .body end)\n\nURL: \(.url)"' > "$RUNNER_TEMP/pr-meta.md"
          diff_bytes="$(jq -r '.bytes' "$RUNNER_TEMP/diff.json")"
          diff_files="$(jq -r '.files' "$RUNNER_TEMP/diff.json")"
          diff_capped="$(jq -r '.capped' "$RUNNER_TEMP/diff.json")"
          diff_capped_bytes="$(jq -r '.cappedBytes' "$RUNNER_TEMP/diff.json")"
          diff_limit="$(jq -r '.limit' "$RUNNER_TEMP/diff.json")"
          if [ -n "${SITE_WORKER_URL:-}" ] && [ -n "${BASE_WORKER_URL:-}" ]; then
            worker_note="- The app's own local Worker also answers, in place of the Cloudflare layer. The head is at $SITE_WORKER_URL and the base is at $BASE_WORKER_URL. Use it for what a file server cannot answer: the status code of an unknown address, a trailing-slash request, /health, a CORS answer, and a redirect."
          elif [ -n "${SITE_WORKER_URL:-}" ] || [ -n "${BASE_WORKER_URL:-}" ]; then
            worker_note="- Only one side answered on its own local Worker this run: head ${SITE_WORKER_URL:-none}, base ${BASE_WORKER_URL:-none}. A behaviour comparison between the two sides is therefore not possible. Use the side that answered, and say plainly which side you could not compare."
          else
            worker_note="- No local Worker dev or preview script answered on this run, so only the built files are served. A redirect, a /health status, a CORS answer or an unknown address therefore cannot be judged from what is running. Say plainly that it is unproven here, and read the checkout for what the code would do."
          fi
          {
            cat <<PROMPT
          You are the independent verifier for a pull request in this repository. You did not write this change. Do not merge, do not push, do not edit the checked-out repository. Judge the change, leave your evidence, then stop.

          ## The goal
          This repository is the new help.hypertask.ai, built on Rat Stack. The parent ticket is HTPR-9126. Every pull request here is one step of that move, and its title starts with the id of its own ticket. The rule the finished site must keep: it looks exactly the same as https://help.hypertask.ai and has the same content. Same colours, same fonts, same sizes, same corners, same words, same page addresses, same links, and the same chat widget. Rat Stack's own look is not acceptable, a rewritten sentence is not acceptable, and a missing help page is not acceptable once the move brings it.

          ## This pull request is one step of a move, not the whole site
          Judge only what this pull request's own ticket and body claim, by comparing the base commit against the head commit.
          - A page, route or file that is missing in BOTH the base and the head is not a finding against this pull request. Early steps build the frame, later steps fill it, and nothing has built every page yet.
          - A page that works in the base and is missing or broken in the head is a finding against this pull request.
          - A page that this pull request claims to have moved, and whose words, look or address differ from the live old site $LIVE_URL, is a finding.
          - Do not fail a step for work its ticket explicitly leaves to another step. Name it as a note and say which step owns it.
          - If the pull request does not claim a change for visitors, say that, and check that the visitor sees no regression.

          ## What you have
          - The pull request head commit $SHA is checked out at the repository root, at $GITHUB_WORKSPACE. That is the change under review.
          - The base commit, the commit this change targets, is checked out at ${RUNNER_TEMP}/base when it could be added. That is what a visitor sees today.
          - The built head site is running at ${SITE_URL}, from the built files in ${SITE_ROOT}. Serve mode for the head: ${SERVE_MODE_HEAD}.
          - The built base site, when the base builds, is running at ${BASE_URL:-none}, from the built files in ${BASE_ROOT:-none}. Serve mode for the base: ${SERVE_MODE_BASE}.
          $worker_note
          - The built files are what a deploy uploads, so a page, an asset, a font and a stylesheet can all be fetched there.
          - The live old site is at $LIVE_URL. The published preview is at $PREVIEW_URL. Read both for look and content. Fetch them with GET only, never post to them, and never send them a chat message.
          - Follow `.claude/skills/verify-ai-chatbot-rs/SKILL.md` and the recipes in `verify/`, especially `node verify/site-doctor.mjs` and `node verify/parity-evidence.mjs` for the feature this pull request touches.
          - The feature map for the help site is verify/feature-map.md. It lists every user-visible feature, the address to try, and what to look for.
          - verify/driver.mjs is the driver. It reads pages, takes screenshots at 1440 and 390, lists links, headings, console errors and failed requests, compares the preview with the old site, probes addresses, and opens the chat widget and reads its visible state without sending a message. It blocks every POST to /api/chat/**, so no chat can reach a live AI through it. Playwright 1.65.1 with Chromium is installed outside the repository and linked at verify/node_modules, so the driver resolves it. SCREENS_DIR points at ${SCREENS_DIR}.
            - node verify/driver.mjs page --head "$PREVIEW_URL" --base "$LIVE_URL" --path /help --path /help/<slug>
            - node verify/driver.mjs compare --head "$PREVIEW_URL" --base "$LIVE_URL" --path /help
            - node verify/driver.mjs widget --head "$PREVIEW_URL" --base "$LIVE_URL" --path /help
            - node verify/parity-evidence.mjs --feature <feature> --path /help/<path>
          - Save every screenshot and report in ${SCREENS_DIR}.
          - The change under review, its title, its body, the files it touches and its diff, is at the end of this prompt.

          ## What to do
          1. Read the pull request's title and body, and name what it claims. Read the diff, then name what a reader would notice.
          2. Run `node verify/site-doctor.mjs`, then drive the published preview at $PREVIEW_URL against the live old site at $LIVE_URL like a user. Run the driver and parity-evidence for the pages in the feature map, and curl the addresses that answer JSON or redirects on the preview. The verify seed is at ${VERIFY_SEED_URL:-unset}. GET /api/articles there returns the 97 recorded articles, and GET /widget/chat?conversation=seed-past-chat opens the seeded past chat. Quote both in the verdict. Do not post a chat message to the seed.
          3. When the built head or base sites are running, compare them too; otherwise judge the preview against the live old site and name any gap in what you could drive.
          4. Try to break it. Unknown paths, a trailing slash, a missing asset, text that differs from the live page, a font or colour or size or corner that differs, a link that goes nowhere, a JavaScript error, a layout that breaks at 390 pixels, a control you cannot reach with the keyboard.
          5. Keep what you used as evidence: the addresses you fetched, the text you compared, the screenshots you took, the driver reports.
          6. Do not log in to the admin pages and do not send a chat message to the live old site. Read them, and use the widget helper for the chat widget.

          ## What changed for a visitor
          Say plainly what a reader of the help site sees differently between the base and the head $SHA. If nothing changed for a visitor, say so and say why that is correct for this change.

          ## The verdict
          Answer with one comment. Its first line is exactly one of these three, with nothing before it:
          VERDICT: PASS
          VERDICT: PASS+NOTES
          VERDICT: FAIL

          PASS means you drove both sites, compared only what this pull request claims, and found nothing a reader would notice. PASS+NOTES means it works, your notes do not block the merge, and the pages or behaviours the change does not cover yet are listed in your notes. FAIL means a reader would notice a regression the pull request causes, a page that worked in the base is broken in the head, or the change does not do what its own ticket asks.

          After that first line, in plain sentences:
          - the head commit SHA you judged, which is $SHA. A verdict covers that commit only.
          - what you ran, with the commands and the addresses.
          - the evidence: what matched, what differed, with the exact text or the screenshot file names.
          - what changed for a visitor.
          - what this step does not cover, and which later step owns it.
          - for a FAIL, the one change that would make it pass.

          Never claim something you did not run.
          PROMPT
            printf '\n## The change under review\n\n'
            cat "$RUNNER_TEMP/pr-meta.md"
            printf '\n## The files this change touches\n\n'
            cat "$RUNNER_TEMP/pr-files.txt"
            printf '\n## The diff\n\n'
            if [ "$diff_capped" = "true" ]; then
              printf 'This diff is large. The copy below is capped at %s bytes of %s bytes, across %s files. The full diff is at %s, so read more of it with sed, head or rg when the claim needs it. This cap is stated in the posted verdict.\n\n' "$diff_capped_bytes" "$diff_bytes" "$diff_files" "$RUNNER_TEMP/pr.diff"
            else
              printf 'The complete diff is below: %s bytes across %s files. It is also at %s. The stated cap for a prompt copy is %s bytes, and this diff did not reach it.\n\n' "$diff_bytes" "$diff_files" "$RUNNER_TEMP/pr.diff" "$diff_limit"
            fi
            printf '~~~diff\n'
            cat "$RUNNER_TEMP/pr.diff.capped"
            printf '~~~\n'
          } > "$RUNNER_TEMP/prompt.md"

      - name: Install the Claude Code CLI
        if: steps.target.outputs.go == 'yes'
        run: |
          set -euo pipefail
          npm install --global --no-fund --no-audit --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code@2.1.325
          claude --version

      - name: Verify with Claude
        id: claude
        if: steps.target.outputs.go == 'yes'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          agent_path="$(dirname "$(command -v claude)"):$(dirname "$(command -v node)"):/usr/local/bin:/usr/bin:/bin"
          env -i \
            HOME="$HOME" \
            PATH="$agent_path" \
            TERM=dumb \
            CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_CODE_OAUTH_TOKEN" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            RUNNER_TEMP="$RUNNER_TEMP" \
            SCREENS_DIR="$SCREENS_DIR" \
            SITE_URL="$SITE_URL" \
            BASE_URL="${BASE_URL:-}" \
            SITE_WORKER_URL="${SITE_WORKER_URL:-}" \
            BASE_WORKER_URL="${BASE_WORKER_URL:-}" \
            SERVE_MODE_HEAD="$SERVE_MODE_HEAD" \
            SERVE_MODE_BASE="$SERVE_MODE_BASE" \
            LIVE_URL="$LIVE_URL" \
            PREVIEW_URL="$PREVIEW_URL" \
            claude --print --dangerously-skip-permissions < "$RUNNER_TEMP/prompt.md" > "$RUNNER_TEMP/verdict.md"
          if grep -qi "weekly limit" "$RUNNER_TEMP/verdict.md"; then
            sed -n '1p' "$RUNNER_TEMP/verdict.md" >&2
            echo "::error::Claude Code subscription weekly limit reached. Retry after the reset time above."
            exit 1
          fi
          first="$(sed -n '1{s/[[:space:]]*$//;p}' "$RUNNER_TEMP/verdict.md")"
          case "$first" in
            "VERDICT: PASS+NOTES"*|"VERDICT: PASS"*|"VERDICT: FAIL"*) ;;
            *)
              echo "::error::Claude produced no verdict line."
              sed -n '1,40p' "$RUNNER_TEMP/verdict.md"
              exit 1
              ;;
          esac
          if ! grep -qi "$SHA" "$RUNNER_TEMP/verdict.md"; then
            echo "::error::The Claude verdict does not name the head commit $SHA."
            exit 1
          fi

      - name: Post the verdict on the pull request
        id: verdict
        if: steps.target.outputs.go == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
          PR: ${{ steps.target.outputs.number }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/verdict.md" ]; then
            echo "::error::The verifier produced no verdict. Claude: ${CLAUDE_OUTCOME:-not run}."
            exit 1
          fi
          first="$(sed -n '1{s/[[:space:]]*$//;p}' "$RUNNER_TEMP/verdict.md")"
          case "$first" in
            "VERDICT: PASS+NOTES"*) verdict="PASS+NOTES" ;;
            "VERDICT: PASS"*) verdict="PASS" ;;
            "VERDICT: FAIL"*) verdict="FAIL" ;;
            *)
              echo "::error::The verifier's first line is not a verdict: $first"
              sed -n '1,40p' "$RUNNER_TEMP/verdict.md"
              exit 1
              ;;
          esac
          if ! grep -qi "$SHA" "$RUNNER_TEMP/verdict.md"; then
            echo "::error::The verdict does not name the head commit $SHA, so it is stale."
            exit 1
          fi
          head_now="$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)"
          if [ "$head_now" != "$SHA" ]; then
            echo "::notice::The pull request head moved from $SHA to $head_now while this run was verifying. A newer run posts the verdict."
            exit 0
          fi
          {
            printf 'pstack-verifier: %s @ %s\n' "$verdict" "$SHA"
            printf 'engine: claude\n'
            printf 'run: %s/%s/actions/runs/%s\n' "$SERVER_URL" "$REPO" "$RUN_ID"
            printf 'head: %s from %s\n' "${SITE_URL:-unset}" "${SITE_ROOT:-unset}"
            printf 'base: %s from %s\n' "${BASE_URL:-none}" "${BASE_ROOT:-none}"
            printf 'serve: head %s, base %s\n' "${SERVE_MODE_HEAD:-unset}" "${SERVE_MODE_BASE:-unset}"
            printf 'diff: %s\n' "$(jq -r 'if .capped then "capped at \(.cappedBytes) bytes of \(.bytes) for the prompt, \(.files) files, the full diff is in the run artifacts" else "complete, \(.bytes) bytes, \(.files) files" end' "$RUNNER_TEMP/diff.json")"
            printf 'reference: %s\n' "$LIVE_URL"
            printf 'ticket: HTPR-9176\n\n'
            sed -n '2,$p' "$RUNNER_TEMP/verdict.md"
          } > "$RUNNER_TEMP/comment.md"
          if ! head -n 1 "$RUNNER_TEMP/comment.md" | grep -Fq "@ $SHA"; then
            echo "::error::The comment does not carry the head commit $SHA on its first line."
            head -n 1 "$RUNNER_TEMP/comment.md"
            exit 1
          fi
          existing="$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq ".[] | select((.body // \"\") | startswith(\"pstack-verifier: \")) | select((.body // \"\") | contains(\"@ $SHA\")) | .id" | head -n 1)"
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$existing" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
            echo "updated comment $existing"
          else
            gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/comment.md"
          fi
          printf 'verdict=%s\n' "$verdict" >> "$GITHUB_OUTPUT"
          printf 'pstack-verifier: %s @ %s\n' "$verdict" "$SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the evidence
        if: always() && steps.target.outputs.go == 'yes'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pstack-verifier-evidence
          path: |
            ${{ runner.temp }}/browser/screens
            ${{ runner.temp }}/verdict.md
            ${{ runner.temp }}/prompt.md
            ${{ runner.temp }}/diff.json
            ${{ runner.temp }}/pr.diff
            ${{ runner.temp }}/pr.diff.capped
            ${{ runner.temp }}/pr-files.txt
            ${{ runner.temp }}/head.log
            ${{ runner.temp }}/base.log
            ${{ runner.temp }}/head-worker.log
            ${{ runner.temp }}/base-worker.log
            ${{ runner.temp }}/seed.log
            ${{ runner.temp }}/seed-page.json
          if-no-files-found: ignore

      - name: Stop the local sites
        if: always() && steps.target.outputs.go == 'yes'
        run: |
          for pid in "$RUNNER_TEMP/head.pid" "$RUNNER_TEMP/base.pid" "$RUNNER_TEMP/head-worker.pid" "$RUNNER_TEMP/base-worker.pid" "$RUNNER_TEMP/seed.pid"; do
            if [ -f "$pid" ]; then
              kill "$(cat "$pid")" 2>/dev/null || true
            fi
          done

      - name: Fail the job when the verdict is FAIL
        if: steps.verdict.outputs.verdict == 'FAIL'
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          echo "::error::The verifier returned FAIL at $SHA. Read the pull request comment."
          exit 1
