name: Publish the help preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-ratstack
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    environment: ratstack-publish
    timeout-minutes: 45
    env:
      TURBO_CACHE: local:rw
      TURBO_TELEMETRY_DISABLED: "1"
      ALCHEMY_TELEMETRY_DISABLED: "1"
      SMOKE_ORIGIN: https://help.hypertask.ai
      SMOKE_BASE_PATH: /ratstack
      SMOKE_DIST: apps/web/dist/client
      SMOKE_STATE: ${{ runner.temp }}/ratstack-old-site.tsv
    steps:
      - name: Require the Cloudflare deploy secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=()
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then missing+=("CLOUDFLARE_API_TOKEN"); fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then missing+=("CLOUDFLARE_ACCOUNT_ID"); fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub secret ${missing[*]}. Add it under Settings, Environments, ratstack-publish, Environment secrets. This job publishes nothing without it."
            exit 1
          fi
          echo "Both Cloudflare deploy secrets are present in the ratstack-publish environment."
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Use Node.js 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Enable corepack pnpm
        run: corepack enable && corepack prepare pnpm@11.3.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch pinned source objects
        run: pnpm sources:fetch
      - name: Check, test and build
        run: pnpm turbo run check test build --concurrency=2
      - name: Record the old site before the deploy
        run: scripts/publish-smoke.sh record
      - name: Deploy the preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @rat-stack/infra exec alchemy deploy --stage prod --yes
      - name: Smoke check the published addresses
        run: scripts/publish-smoke.sh verify
